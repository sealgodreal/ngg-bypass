<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&display=swap" rel="stylesheet">
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #vanta {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      transform: scale(1.1);
    }
    #loading {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #c8c8c8;
      font-family: "Comfortaa", sans-serif;
      text-align: center;
    }
    .loading-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .main-text {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -2px;
    }
    .subtext {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #888;
    }
  </style>
</head>
<body>
  <div id="vanta"></div>
  <div id="loading">
    <div class="loading-content">
      <div class="main-text">launching your game...</div>
      <div class="subtext">please be patient.</div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.fog.min.js"></script>
  <script>
    VANTA.FOG({
      el: "#vanta",
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      minHeight: 200.00,
      minWidth: 200.00,
      highlightColor: 0x2a2a2a,
      midtoneColor: 0x1c1c1c,
      lowlightColor: 0x101010,
      baseColor: 0x080808,
      blurFactor: 1,
      speed: 5,
      zoom: 0.6
    });
  </script>
</body>
</html>
